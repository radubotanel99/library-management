<mat-toolbar color="primary">
  <span class="title">{{ 'app.title' | translate }}</span>

  <nav>
    <a
      matButton
      routerLink="/books"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ 'nav.books' | translate }}
    </a>
    <a matButton routerLink="/books/archive" routerLinkActive="active-link">
      {{ 'nav.archive' | translate }}
    </a>
    <a matButton routerLink="/categories" routerLinkActive="active-link">
      {{ 'nav.categories' | translate }}
    </a>
    <a matButton routerLink="/members" routerLinkActive="active-link">
      {{ 'nav.members' | translate }}
    </a>
    <a matButton routerLink="/loans" routerLinkActive="active-link">
      {{ 'nav.loans' | translate }}
    </a>
    <a matButton routerLink="/settings" routerLinkActive="active-link">
      {{ 'nav.settings' | translate }}
    </a>
  </nav>

  <span class="spacer"></span>

  <button
    matButton
    [matMenuTriggerFor]="languageMenu"
    [attr.aria-label]="'common.language' | translate"
  >
    <mat-icon>language</mat-icon>
    {{ langLabel(lang()) | translate }}
  </button>
  <mat-menu #languageMenu="matMenu">
    @for (option of langs; track option) {
      <button mat-menu-item [disabled]="option === lang()" (click)="setLang(option)">
        {{ langLabel(option) | translate }}
      </button>
    }
  </mat-menu>
</mat-toolbar>

<main>
  <router-outlet />
</main>
