<!-- Decorative only: a soft, blurred "photo" of a bookshelf that every page floats on. -->
<div class="app-backdrop" aria-hidden="true">
  <div class="app-backdrop__glow app-backdrop__glow--rose"></div>
  <div class="app-backdrop__glow app-backdrop__glow--gold"></div>
  <div class="app-backdrop__glow app-backdrop__glow--blush"></div>
  <div class="app-backdrop__shelf">
    @for (spine of spines; track $index) {
      <i [style.width.px]="spine.width" [style.height.px]="spine.height" [style.background]="spine.color"></i>
    }
  </div>
  <div class="app-backdrop__scrim"></div>
</div>

<nav class="la la-sidebar app-sidebar" [attr.aria-label]="'nav.main' | translate">
  <div class="app-sidebar__top">
    <a class="la-sidebar__brand app-sidebar__brand" routerLink="/dashboard" (click)="closeMenu()">
      <mat-icon aria-hidden="true">local_library</mat-icon>
      <span>{{ 'app.title' | translate }}</span>
    </a>

    @if (compact()) {
      <button
        type="button"
        class="la-nav app-sidebar__button app-sidebar__menu-toggle"
        aria-controls="app-sidebar-links"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="'nav.menu' | translate"
        (click)="toggleMenu()"
      >
        <mat-icon aria-hidden="true">{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    }
  </div>

  @if (linksVisible()) {
    <div id="app-sidebar-links" class="app-sidebar__links">
      @for (item of navItems; track item.path) {
        @if (item.dividerBefore) {
          <div class="app-sidebar__divider" role="separator"></div>
        }
        <a
          class="la-nav"
          [routerLink]="item.path"
          routerLinkActive="app-nav--active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="closeMenu()"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          {{ item.labelKey | translate }}
        </a>
      }

      <div class="app-sidebar__footer">
        <button type="button" class="la-nav app-sidebar__button" (click)="toggleTheme()">
          <mat-icon aria-hidden="true">{{ themeToggleIcon() }}</mat-icon>
          {{ themeToggleLabel() | translate }}
        </button>
      </div>
    </div>
  }
</nav>

<main class="app-main">
  <router-outlet />
</main>
