<mat-toolbar color="primary">
  <a class="title" routerLink="/dashboard">{{ 'app.title' | translate }}</a>

  <nav>
    <!-- First, and the landing route: it is the screen a shift starts on. -->
<!--    <a matButton routerLink="/dashboard" routerLinkActive="active-link">-->
<!--      {{ 'nav.dashboard' | translate }}-->
<!--    </a>-->
    <a
      matButton
      routerLink="/books"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ 'nav.books' | translate }}
    </a>
    <a matButton routerLink="/categories" routerLinkActive="active-link">
      {{ 'nav.categories' | translate }}
    </a>
    <a matButton routerLink="/members" routerLinkActive="active-link">
      {{ 'nav.members' | translate }}
    </a>
    <a matButton routerLink="/loans" routerLinkActive="active-link">
      {{ 'nav.loans' | translate }}
    </a>
  </nav>

  <span class="spacer"></span>

  <a matButton routerLink="/settings" routerLinkActive="active-link">
    <mat-icon>settings</mat-icon>
    {{ 'nav.settings' | translate }}
  </a>
</mat-toolbar>

<main>
  <router-outlet />
</main>
